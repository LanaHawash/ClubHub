name: clubhub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: clubhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clubhub_dev

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - clubhub_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubhub -d clubhub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clubhub_postgres_data:

  